name: iOS Simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Install iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore SkiaSharpGraphicsInteropSamples.slnx

      - name: Build iOS Simulator sample
        run: >-
          dotnet build samples/EvergineMauiMetal/EvergineMauiMetal.csproj
          --no-restore
          -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
